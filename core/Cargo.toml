[package]
name = "fairisle-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Stateless core of the Fair Isle Pattern Builder: parse, serialize, validate, compile and lay out fair isle patterns."
repository = "https://github.com/ostpopcorn/fair-isle-patterns"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
# wasm-opt is downloaded from GitHub on demand; keep builds hermetic.
wasm-opt = false
